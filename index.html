<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>図形パズル（タングラム）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #f8fafc;
        }

        #game-svg {
            display: block;
            width: 100%;
            height: calc(100vh - 64px);
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .draggable {
            cursor: grab;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            transition: filter 0.2s, stroke-width 0.2s;
        }

        .draggable:active {
            cursor: grabbing;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.3));
        }

        .snapped {
            cursor: default;
            filter: brightness(0.9);
            pointer-events: none;
            transition: filter 0.3s;
        }
        
        .silhouette {
            fill: #cbd5e1;
            stroke: #94a3b8;
            stroke-width: 2;
            stroke-dasharray: 4;
        }

        .silhouette-merged {
            fill: #94a3b8;
            stroke: #94a3b8;
            stroke-width: 2;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen m-0 p-0">

    <!-- タイトル・レベル選択画面 -->
    <div id="screen-title" class="flex flex-col items-center justify-center w-full h-full bg-slate-800 text-white absolute inset-0 z-50">
        <h1 class="text-5xl font-extrabold mb-8 tracking-widest drop-shadow-lg">図形パズル</h1>
        <p class="text-xl mb-12 text-slate-300">レベルをえらんでね</p>
        
        <div class="flex flex-col gap-6 w-4/5 max-w-md">
            <button id="btn-level-1" class="bg-blue-500 hover:bg-blue-400 text-white font-bold py-4 px-8 rounded-full shadow-xl text-xl transition-transform active:scale-95 flex flex-col items-center">

    </div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="flex flex-col w-full h-full hidden">
        <header class="h-16 bg-slate-800 text-white flex items-center justify-between px-6 shadow-md select-none">
            <h1 id="current-level-display" class="text-xl font-bold tracking-wider">Level 1 - Q1</h1>
            <div class="flex gap-4">
                <button id="btn-skip" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded transition-colors shadow-sm">
                    スキップ ⏭
                </button>
                <button id="btn-quit" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded transition-colors shadow-sm">
                    やめる
                </button>
            </div>
        </header>

        <main class="flex-1 relative w-full h-full">
            <svg id="game-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;">
                <g id="silhouette-group"></g>
                <g id="pieces-group"></g>
            </svg>

                    <button id="next-level-btn" class="bg-yellow-400 hover:bg-yellow-500 text-slate-800 font-bold py-3 px-8 rounded-full shadow-lg text-lg w-full transition-transform active:scale-95">
                        次の問題へ
                    </button>
                </div>
            </div>
        </main>
    </div>

        const clearModal = document.getElementById('clear-modal');
        const levelDisplay = document.getElementById('current-level-display');

        // レベル選択ボタンのイベント
        document.getElementById('btn-level-1').onclick = () => startLevel(1);
        document.getElementById('btn-level-2').onclick = () => startLevel(2);
        document.getElementById('btn-level-3').onclick = () => startLevel(3);

        // やめるボタン
        document.getElementById('btn-quit').onclick = () => {
            screenGame.classList.add('hidden');
            screenTitle.classList.remove('hidden');
            clearModal.classList.add('hidden');
        };

        // スキップボタン / 次の問題ボタン
        const advanceQuestion = () => {
            clearModal.classList.add('hidden');
            currentQuestionIndex++;
            if (currentQuestionIndex < gameData[currentLevel].length) {
                loadStage(currentLevel, currentQuestionIndex);
            } else {
                // 最終問題ならタイトルへ戻る
                document.getElementById('btn-quit').click();
            }
        };
        document.getElementById('btn-skip').onclick = advanceQuestion;
        document.getElementById('next-level-btn').onclick = advanceQuestion;

        function startLevel(level) {
            currentLevel = level;
            currentQuestionIndex = 0;
            screenTitle.classList.add('hidden');
            screenGame.classList.remove('hidden');
            loadStage(currentLevel, currentQuestionIndex);
        }

        function loadStage(level, index) {
            const qData = gameData[level][index];
            levelDisplay.textContent = `Level ${level} - Q${index + 1}`;
            silhouetteGroup.innerHTML = '';
            piecesGroup.innerHTML = '';
            
            piecesLeft = qData.pieces.length;
            
            // 賢いスナップ用のターゲット枠を初期化（id, 形のパス, 座標, 使用済みフラグ）
            targetSlots = qData.pieces.map(p => ({
                id: p.id,
                path: p.path,
                targetX: p.targetX,
                targetY: p.targetY,
                isOccupied: false
            }));

            // シルエット（正解の枠）の描画
            qData.pieces.forEach(p => {
                const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElement.setAttribute('d', p.path);
                pathElement.setAttribute('transform', `translate(${p.targetX}, ${p.targetY})`);
                pathElement.setAttribute('class', qData.showLines ? 'silhouette' : 'silhouette-merged');
                silhouetteGroup.appendChild(pathElement);
            });

            // ピース配列をランダムにシャッフルする
            const shuffledPieces = [...qData.pieces].sort(() => Math.random() - 0.5);

            // ピース（ドラッグ可能な図形）の描画
            shuffledPieces.forEach((p, index) => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'draggable');
                
                // 動的配置（ピースが5個を超える場合は2段で配置）
                const piecesCount = shuffledPieces.length;
                let cols = piecesCount > 5 ? Math.ceil(piecesCount / 2) : piecesCount;
                let row = Math.floor(index / cols);
                let col = index % cols;
                
                // 画面幅（800）から等間隔に配置
                const startX = (800 / (cols + 1)) * (col + 1) - 50; 
                const startY = 440 + (row * 90);

                g.setAttribute('transform', `translate(${startX}, ${startY})`);
                g.dataset.path = p.path; // スナップ判定のために形(path)を記憶

                const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathElement.setAttribute('d', p.path);
                pathElement.setAttribute('fill', p.color);
                
                g.appendChild(pathElement);
                piecesGroup.appendChild(g);

                // ドラッグ処理の変数
                let isDragging = false;
                let offset = { x: 0, y: 0 };
                let currentTransform = { x: startX, y: startY };

                g.addEventListener('pointerdown', (e) => {
                    isDragging = true;
                    const svg = document.getElementById('game-svg');
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const cursorPt = pt.matrixTransform(svg.getScreenCTM().inverse());
                    
                    offset.x = cursorPt.x - currentTransform.x;
                    offset.y = cursorPt.y - currentTransform.y;
                    
                    // タッチした図形を最前面へ移動
                    piecesGroup.appendChild(g);
                    g.setPointerCapture(e.pointerId);
                });

                g.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault(); // スクロール防止
                    
                    const svg = document.getElementById('game-svg');
                    const pt = svg.createSVGPoint();
                    pt.x = e.clientX;
                    pt.y = e.clientY;
                    const cursorPt = pt.matrixTransform(svg.getScreenCTM().inverse());
                    
                    currentTransform.x = cursorPt.x - offset.x;
                    currentTransform.y = cursorPt.y - offset.y;
                    g.setAttribute('transform', `translate(${currentTransform.x}, ${currentTransform.y})`);
                });

                g.addEventListener('pointerup', (e) => {
                    if (!isDragging) return;
                    isDragging = false;
                    g.releasePointerCapture(e.pointerId);

                    // 賢いスナップ判定 (同じ形で、まだ埋まっていない枠を探す)
                    const snapDistance = 30; // 吸着する距離

                    for (let slot of targetSlots) {
                        if (!slot.isOccupied && slot.path === g.dataset.path) {
                            const dx = currentTransform.x - slot.targetX;
                            const dy = currentTransform.y - slot.targetY;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < snapDistance) {
                                // 吸着成功
                                slot.isOccupied = true;
                                g.setAttribute('transform', `translate(${slot.targetX}, ${slot.targetY})`);
                                g.classList.remove('draggable');
                                g.classList.add('snapped');
                                piecesLeft--;

                                // すべてハマったらクリアモーダル表示
                                if (piecesLeft === 0) {
                                    setTimeout(() => {
                                        clearModal.classList.remove('hidden');
                                    }, 400);
                                }
                                break; // 1つの枠に吸着したらループ終了
                            }
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
