<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- ピンチズームやダブルタップ拡大を無効化し、誤操作を防ぐ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タングラム学習</title>
<!-- Fabric.jsの読み込み -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    touch-action: none; /* スワイプによるブラウザの戻る/進むを無効化 */
    user-select: none; /* テキスト選択無効化 */
  }
  body {
    margin: 0;
    padding: 0;
    background-color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  /* 位置ズレを完全に防ぐ固定コンテナ */
  #game-container {
    position: relative;
    width: 1024px;
    height: 768px;
    background-color: #fff;
    /* JSで画面サイズに合わせてtransform: scale()を適用します */
    transform-origin: center center;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  canvas {
    display: block;
  }
  /* 操作パネル */
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    background: rgba(255, 255, 255, 0.9);
    padding: 15px 30px;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  button {
    font-size: 24px;
    padding: 15px 30px;
    border: 2px solid #555;
    border-radius: 10px;
    background-color: #f0f0f0;
    cursor: pointer;
    font-weight: bold;
  }
  button:active {
    background-color: #ddd;
  }
  button:disabled {
    opacity: 0.5;
  }
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    color: red;
    font-weight: bold;
    display: none;
    pointer-events: none;
    text-shadow: 2px 2px 5px white;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="c" width="1024" height="768"></canvas>
  
  <div id="controls">
    <button id="btn-rotate-left">↺ 左に回す</button>
    <button id="btn-rotate-right">↻ 右に回す</button>
    <button id="btn-flip">裏返す</button>
  </div>
  
  <div id="message">クリア！</div>
</div>

<script>
// --- 画面サイズへのスケール自動調整（絶対位置ズレ防止） ---
function resizeGame() {
  const container = document.getElementById('game-container');
  const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 768);
  container.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);
resizeGame();

// --- Fabric.js 初期化 ---
const canvas = new fabric.Canvas('c', {
  selection: false, // 複数選択無効
  preserveObjectStacking: true // 選択したオブジェクトが自動で最前面にくる設定
});

// --- タングラムのベース図形定義（色付き、初期位置） ---
// Fabric.jsのPolygonを使って厳密な多角形を生成します
const colors = ['#f58220', '#8dc63f', '#00aeef', '#ec008c', '#fff200', '#951b81', '#ed1c24'];
let activePiece = null;

// ※ここではテストとして、直角二等辺三角形（大）を1つ生成する関数を用意します。
// 実際には7つのピースすべてを数学的に正確な座標配列で定義します。
function createTriangleLarge(color, startX, startY) {
  const tri = new fabric.Polygon([
    {x: 0, y: 0},
    {x: 200, y: 0},
    {x: 100, y: 100}
  ], {
    fill: color,
    left: startX,
    top: startY,
    originX: 'center',
    originY: 'center',
    hasControls: false, // 四隅の拡大縮小ツマミを消す（ドラッグのみ許可）
    hasBorders: true,   // 選択時の枠線を許可
    borderColor: 'red',
    borderScaleFactor: 3,
    padding: 5,
    transparentCorners: false
  });
  return tri;
}

// テスト用ピース配置
const piece1 = createTriangleLarge(colors[0], 200, 200);
canvas.add(piece1);

// --- 選択状態のハンドリング ---
canvas.on('selection:created', function(e) { activePiece = e.selected[0]; });
canvas.on('selection:updated', function(e) { activePiece = e.selected[0]; });
canvas.on('selection:cleared', function() { activePiece = null; });

// --- ボタン操作（回転と反転） ---
document.getElementById('btn-rotate-right').addEventListener('click', () => {
  if (!activePiece) return;
  // 45度ずつ回転
  activePiece.set('angle', (activePiece.angle + 45) % 360);
  canvas.renderAll();
  checkSnapAndClear();
});

document.getElementById('btn-rotate-left').addEventListener('click', () => {
  if (!activePiece) return;
  activePiece.set('angle', (activePiece.angle - 45 + 360) % 360);
  canvas.renderAll();
  checkSnapAndClear();
});

document.getElementById('btn-flip').addEventListener('click', () => {
  if (!activePiece) return;
  // X軸方向に反転（平行四辺形用）
  activePiece.set('flipX', !activePiece.flipX);
  canvas.renderAll();
  checkSnapAndClear();
});

// --- 吸着（スナップ）とクリア判定ロジック ---
// 今回はテストとして「x:600, y:400, angle:90」を正解位置と仮定
const TARGET = { x: 600, y: 400, angle: 90 };
const SNAP_RADIUS = 40; // 40ピクセル以内に近づいたら吸着

canvas.on('object:modified', function(e) {
  checkSnapAndClear();
});

function checkSnapAndClear() {
  const obj = activePiece;
  if (!obj) return;

  // 現在地と正解位置の距離を計算
  const dx = obj.left - TARGET.x;
  const dy = obj.top - TARGET.y;
  const distance = Math.sqrt(dx * dx + dy * dy);

  // 距離が近く、かつ角度が一致していれば吸着（完全一致以外は弾く）
  // ※平行四辺形の場合は反転フラグのチェックもここに追加します
  if (distance < SNAP_RADIUS && obj.angle === TARGET.angle) {
    obj.set({
      left: TARGET.x,
      top: TARGET.y,
      selectable: false, // 固定して動かせなくする
      evented: false
    });
    canvas.discardActiveObject();
    canvas.renderAll();
    
    // 全ピースが固定されたかどうかの判定（テスト版では即クリア）
    document.getElementById('message').style.display = 'block';
  }
}
</script>
</body>
</html>
