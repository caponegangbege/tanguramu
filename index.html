<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>図形パズル（タングラム）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #f8fafc;
        }

        #game-svg {
            display: block;
            width: 100%;
            height: calc(100vh - 64px);
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .draggable {
            cursor: grab;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
            transition: filter 0.2s, stroke-width 0.2s;
        }

        .draggable:active {
            cursor: grabbing;
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.3));
        }

        .snapped {
            cursor: default;
            filter: brightness(0.9);
            pointer-events: none;
            transition: filter 0.3s;
        }
        
        .silhouette {
            fill: #cbd5e1;
            stroke: #94a3b8;
            stroke-width: 2;
            stroke-dasharray: 4;
        }

        /* 境界線を消す（完全なシルエット化） */
        .silhouette-merged {
            fill: #94a3b8;
            stroke: #94a3b8;
            stroke-width: 2;
        }
    </style>
</head>

                        次の問題へ

                </div>
            </div>
        </main>

                        { id: 'l3-q18-sq2', path: 'M0,0 L100,0 L100,100 L0,100 Z', color: '#ef4444', targetX: 350, targetY: 206.6 },
                        { id: 'l3-q18-rect1', path: 'M0,0 L140,0 L140,70 L0,70 Z', color: '#22c55e', targetX: 330, targetY: 306.6 },
                        { id: 'l3-q18-rect2', path: 'M0,0 L140,0 L140,70 L0,70 Z', color: '#22c55e', targetX: 190, targetY: 306.6 },
                        { id: 'l3-q18-rect3', path: 'M0,0 L140,0 L140,70 L0,70 Z', color: '#22c55e', targetX: 470, targetY: 306.6 },
                        { id: 'l3-q18-iso1', path: 'M70,0 L140,40 L0,40 Z', color: '#eab308', targetX: 190, targetY: 266.6 },
                        { id: 'l3-q18-iso2', path: 'M70,0 L140,40 L0,40 Z', color: '#eab308', targetX: 470, targetY: 266.6 },
                        { id: 'l3-q18-sq3', path: 'M0,0 L100,0 L100,100 L0,100 Z', color: '#ef4444', targetX: 210, targetY: 376.6 },
                        { id: 'l3-q18-sq4', path: 'M0,0 L100,0 L100,100 L0,100 Z', color: '#ef4444', targetX: 490, targetY: 376.6 }
                    ]
                }
            ]
        };

        const SNAP_DISTANCE = 30;

        const screenTitle = document.getElementById('screen-title');
        const screenGame = document.getElementById('screen-game');
        const levelDisplay = document.getElementById('current-level-display');
        const svg = document.getElementById('game-svg');
        const silhouetteGroup = document.getElementById('silhouette-group');
        const piecesGroup = document.getElementById('pieces-group');
        const clearModal = document.getElementById('clear-modal');
        const nextLevelBtn = document.getElementById('next-level-btn');

        let currentLevel = 1;
        let currentStageIndex = 0;
        let pieces = [];
        let targetSlots = []; 
        let draggingPiece = null;
        let offset = { x: 0, y: 0 };
        let svgPoint = svg.createSVGPoint();

        function showTitleScreen() {
            screenTitle.classList.remove('hidden');
            screenGame.classList.add('hidden');
            clearModal.classList.add('hidden');
        }

        function startGame(level) {
            currentLevel = level;
            currentStageIndex = 0;
            screenTitle.classList.add('hidden');
            screenGame.classList.remove('hidden');
            loadStage();
        }

        function nextStage() {
            currentStageIndex++;
            const currentLevelData = gameData[currentLevel];
            
            if (currentStageIndex >= currentLevelData.length) {
                showTitleScreen();
            } else {
                loadStage();
            }
        }

        function loadStage() {
            clearModal.classList.add('hidden');
            levelDisplay.textContent = `Level ${currentLevel} - Q${currentStageIndex + 1}`;
            
            silhouetteGroup.innerHTML = '';
            piecesGroup.innerHTML = '';
            pieces = [];
            targetSlots = []; 
            draggingPiece = null;

            const stageData = gameData[currentLevel][currentStageIndex];
            const currentData = stageData.pieces;
            const showLines = stageData.showLines;

            const pieceCount = currentData.length;
            
            // ピース数が多い場合は少し下から開始
            const startY1 = pieceCount > 7 ? 460 : (pieceCount > 5 ? 450 : 430); 
            const startY2 = pieceCount > 7 ? 550 : (pieceCount > 5 ? 540 : 530); 
            const totalWidth = 800;

            currentData.forEach((data, index) => {
                targetSlots.push({
                    path: data.path, 
                    targetX: data.targetX,
                    targetY: data.targetY,
                    isOccupied: false
                });

                const silEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                silEl.setAttribute('d', data.path);
                silEl.setAttribute('transform', `translate(${data.targetX}, ${data.targetY})`);
                
                if (showLines) {
                    silEl.setAttribute('class', 'silhouette');
                } else {
                    silEl.setAttribute('class', 'silhouette-merged');
                }
                silhouetteGroup.appendChild(silEl);

                let row = 1;
                let colsInRow = pieceCount;
                let colIndex = index;

                if (pieceCount > 5) {
                    const topCount = Math.ceil(pieceCount / 2);
                    if (index < topCount) {
                        row = 1;
                        colsInRow = topCount;
                        colIndex = index;
                    } else {
                        row = 2;
                        colsInRow = pieceCount - topCount;
                        colIndex = index - topCount;
                    }
                }

                const spacing = totalWidth / (colsInRow + 1);
                const pieceStartX = spacing * (colIndex + 1) - 50; 
                const pieceStartY = row === 1 ? startY1 : startY2;

                const pieceGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                pieceGroup.setAttribute('id', `piece-${index}`);
                pieceGroup.setAttribute('class', 'draggable');
                pieceGroup.setAttribute('transform', `translate(${pieceStartX}, ${pieceStartY})`);
                
                const piecePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                piecePath.setAttribute('d', data.path);
                piecePath.setAttribute('fill', data.color);
                piecePath.setAttribute('stroke', 'rgba(0,0,0,0.1)');
                piecePath.setAttribute('stroke-width', '2');
                
                pieceGroup.appendChild(piecePath);
                piecesGroup.appendChild(pieceGroup);

                const pieceState = {
                    path: data.path, 
                    element: pieceGroup,
                    currentX: pieceStartX,
                    currentY: pieceStartY,
                    isSnapped: false
                };
                pieces.push(pieceState);

                pieceGroup.addEventListener('pointerdown', (e) => onPointerDown(e, pieceState));
            });
        }

        function getMousePosition(evt) {
            svgPoint.x = evt.clientX;
            svgPoint.y = evt.clientY;
            return svgPoint.matrixTransform(svg.getScreenCTM().inverse());
        }

        function onPointerDown(e, pieceState) {
            if (pieceState.isSnapped) return;
            draggingPiece = pieceState;
            const pointerPos = getMousePosition(e);
            offset.x = pointerPos.x - pieceState.currentX;
            offset.y = pointerPos.y - pieceState.currentY;
            piecesGroup.appendChild(pieceState.element);
            pieceState.element.setPointerCapture(e.pointerId);
        }

        function onPointerMove(e) {
            if (!draggingPiece) return;
            e.preventDefault();
            const pointerPos = getMousePosition(e);
            let newX = pointerPos.x - offset.x;
            let newY = pointerPos.y - offset.y;
            draggingPiece.currentX = newX;
            draggingPiece.currentY = newY;
            draggingPiece.element.setAttribute('transform', `translate(${newX}, ${newY})`);
        }

        function onPointerUp(e) {
            if (!draggingPiece) return;
            if (e.pointerId) {
                draggingPiece.element.releasePointerCapture(e.pointerId);
            }
            checkSnap(draggingPiece);
            draggingPiece = null;
        }

        function checkSnap(piece) {
            let closestTarget = null;
            let minDistance = SNAP_DISTANCE + 1;

            for (const target of targetSlots) {
                if (!target.isOccupied && target.path === piece.path) {
                    const dx = target.targetX - piece.currentX;
                    const dy = target.targetY - piece.currentY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < minDistance) {
                        minDistance = distance;
                        closestTarget = target;
                    }
                }
            }

            if (closestTarget && minDistance <= SNAP_DISTANCE) {
                piece.currentX = closestTarget.targetX;
                piece.currentY = closestTarget.targetY;
                piece.element.setAttribute('transform', `translate(${closestTarget.targetX}, ${closestTarget.targetY})`);
                
                piece.isSnapped = true;
                closestTarget.isOccupied = true; 
                
                piece.element.classList.remove('draggable');
                piece.element.classList.add('snapped');
                
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            if (pieces.every(p => p.isSnapped)) {
                const currentLevelData = gameData[currentLevel];
                if (currentStageIndex >= currentLevelData.length - 1) {
                    nextLevelBtn.textContent = "レベルクリア！（タイトルへ）";
                } else {
                    nextLevelBtn.textContent = "次の問題へ";
                }

                setTimeout(() => {
                    clearModal.classList.remove('hidden');
                }, 300);
            }
        }

        svg.addEventListener('pointermove', onPointerMove);
        svg.addEventListener('pointerup', onPointerUp);
        svg.addEventListener('pointercancel', onPointerUp);
        svg.addEventListener('pointerleave', onPointerUp);

    </script>
</body>
</html>
